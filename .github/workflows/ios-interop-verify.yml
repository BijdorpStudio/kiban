# On-demand macOS/Xcode toolchain access for iOS/Swift interop verification: a dispatch-only job
# that pulls real, inspectable build output (framework headers, toolchain versions) and runs
# samples/swift-console, which gradle.yml keeps compiling on every pull request anyway.
#
# Why it exists and what it costs: docs/209-ci-workflow-notes.md. The interop findings themselves
# are in docs/9-swift-interop-review.md.
name: iOS/Swift interop verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cache-konan

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Report Xcode and Swift toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test Apple targets
        run: ./gradlew iosSimulatorArm64Test macosArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test checkKotlinAbi

      - name: Assemble the Kiban XCFramework
        run: ./gradlew :kiban:assembleKibanDebugXCFramework

      - name: Dump the generated Objective-C header
        run: |
          find kiban/build/XCFrameworks -iname "*.h" -print -exec cat {} \;

      - name: Build and run samples/swift-console
        run: |
          mkdir -p samples/swift-console/Frameworks
          cp -R kiban/build/XCFrameworks/debug/Kiban.xcframework samples/swift-console/Frameworks/
          cd samples/swift-console
          swift run SwiftConsole

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-interop-verify-test-reports
          path: kiban/build/reports/tests/
          retention-days: 7
