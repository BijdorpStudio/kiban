# On-demand macOS/Xcode toolchain access for iOS/Swift interop verification (#9, #91).
#
# gradle.yml already builds and tests every Apple target on every PR, but that matrix only
# runs on push/PR and only reports pass/fail — it doesn't give a maintainer or agent a way to
# pull real, inspectable build output (framework headers, toolchain versions) on demand.
# This workflow exists for that: a workflow_dispatch-only job on a macos-latest runner, so
# interop questions can be answered without a maintainer sitting at a physical Mac and
# without paying for a persistent macOS environment.
#
# Cost control: this never runs automatically (workflow_dispatch only), GitHub-hosted macOS
# runner minutes are free for this public repo (same as the macos-latest jobs in gradle.yml),
# and the runner is released as soon as the job finishes — there's no standing/always-on cost.
#
# Also builds and runs samples/swift-console (#68). Keeping the sample compiling is no longer
# this workflow's job — gradle.yml's 'swift-console' matrix entry does that on every push and
# pull request (#155), where a regression can still be caught before a release. It is repeated
# here so an on-demand run answers an interop question against the same artifact a consumer
# gets, with the header dump above it. The #9 interop research probes (Result<Iban> erasure,
# the IbanParseException hierarchy, undeclared-throw behavior) and the Swift Export experiment
# live on the swift-export-playground branch, with their findings recorded in
# docs/9-swift-interop-review.md.
name: iOS/Swift interop verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cache-konan

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Report Xcode and Swift toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test Apple targets
        run: ./gradlew iosSimulatorArm64Test macosArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test checkKotlinAbi

      - name: Assemble the Kiban XCFramework
        run: ./gradlew :library:assembleKibanDebugXCFramework

      - name: Dump the generated Objective-C header
        run: |
          find library/build/XCFrameworks -iname "*.h" -print -exec cat {} \;

      - name: Build and run samples/swift-console
        run: |
          mkdir -p samples/swift-console/Frameworks
          cp -R library/build/XCFrameworks/debug/Kiban.xcframework samples/swift-console/Frameworks/
          cd samples/swift-console
          swift run SwiftConsole

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-interop-verify-test-reports
          path: library/build/reports/tests/
          retention-days: 7
