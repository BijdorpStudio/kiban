# On-demand macOS/Xcode toolchain access for iOS/Swift interop verification: a dispatch-only job
# that pulls real, inspectable build output (framework headers, toolchain versions) and runs
# samples/swift-console, which gradle.yml keeps compiling on every pull request anyway.
#
# Why it exists and what it costs: docs/ci-workflow-notes.md. The interop findings themselves
# are in docs/swift-interop-review.md.
name: iOS/Swift interop verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    # Assembles the XCFramework and builds and runs the Swift sample on a macOS runner, cold konan
    # cache included. Matched to publish.yml's Apple jobs rather than the 30 the gradle.yml matrix
    # uses: this one is 'workflow_dispatch'-only, so the cost of a high cap is a runner nobody is
    # waiting on, while a cap that cuts a real run short wastes a maintainer's manual dispatch.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dispatch-only and never on 'main', so the Gradle cache stays read-only --
      # the action's default. No encryption key is passed, as before: without one
      # setup-gradle skips the configuration-cache part of the entry and restores
      # the rest, which is all an on-demand diagnostic run needs.
      - uses: ./.github/actions/setup-build

      - name: Report Xcode and Swift toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test Apple targets
        run: ./gradlew iosSimulatorArm64Test macosArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test checkKotlinAbi

      - name: Assemble the Kiban XCFramework
        run: ./gradlew :kiban:assembleKibanDebugXCFramework

      - name: Dump the generated Objective-C header
        run: |
          find kiban/build/XCFrameworks -iname "*.h" -print -exec cat {} \;

      - name: Build and run samples/swift-console
        run: |
          mkdir -p samples/swift-console/Frameworks
          cp -R kiban/build/XCFrameworks/debug/Kiban.xcframework samples/swift-console/Frameworks/
          cd samples/swift-console
          swift run SwiftConsole

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-interop-verify-test-reports
          path: kiban/build/reports/tests/
          retention-days: 7
