# Main workflow for check PRs and merges

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: macosArm64Test
            os: macos-latest
          - target: tvosSimulatorArm64Test
            os: macos-latest
          - target: watchosSimulatorArm64Test
            os: macos-latest
          - target: jvmTest
            os: ubuntu-latest
          - target: linuxX64Test
            os: ubuntu-latest
          - target: jsTest
            os: ubuntu-latest
          - target: wasmJsTest
            os: ubuntu-latest
          # Targets with no runner to execute on: cross-compile only.
          - target: compileKotlinLinuxArm64 compileKotlinMingwX64
            os: ubuntu-latest
          # apiCheck builds a klib for every target the host supports, so it
          # doubles as the compile check for the Apple targets.
          - target: apiCheck
            os: macos-latest
          - target: assembleAndroidMain androidCompileLintChecks
            os: ubuntu-latest
          # Generation only, no deploy: catches broken KDoc/sourceLink before a
          # release tag is cut. Actual publish to GitHub Pages stays in publish.yml.
          - target: :library:dokkaGeneratePublicationHtml
            os: ubuntu-latest
          - target: ktfmtCheck
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/cache@v6
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Only write to the cache for builds on the 'main' and 'release' branches. (Default is 'main' only.)
        # Builds on other branches will only read existing entries from the cache.
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Build with Gradle
      run: ./gradlew ${{ matrix.target }}

    - name: Upload API docs preview
      if: matrix.target == ':library:dokkaGeneratePublicationHtml'
      uses: actions/upload-artifact@v7
      with:
        name: api-docs-preview
        path: library/build/dokka/html
        retention-days: 7

    - name: Upload test reports
      if: failure() && contains(matrix.target, 'Test')
      uses: actions/upload-artifact@v7
      with:
        name: test-reports-${{ matrix.target }}-${{ matrix.os }}
        path: library/build/reports/tests/
        retention-days: 7

  samples:
    name: Build samples against the published artifact
    # samples/ (#68) resolves kiban by Maven coordinates, not by depending on :library directly,
    # so this exercises the real published artifact shape (POM, Gradle module metadata, per-target
    # variants). publishToMavenLocal needs every declared Kotlin target buildable on one host (see
    # verifyPublicationTargets in library/build.gradle.kts) -- macos-latest is the only
    # GitHub-hosted runner that covers all of them: Apple targets natively, Android SDK
    # preinstalled, linuxX64/mingwX64 via Kotlin/Native cross-compilation, JS/wasm via Node.
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/cache@v6
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Publish kiban to mavenLocal
      run: ./gradlew publishToMavenLocal

    - name: Build and test jvm-cli against the published artifact
      run: ./gradlew -p samples :jvm-cli:test

    - name: Check jvm-cli formatting
      run: ./gradlew -p samples :jvm-cli:ktfmtCheck

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports-samples-jvm-cli
        path: samples/jvm-cli/build/reports/tests/
        retention-days: 7
