# Main workflow for checking pull requests and merges.
# Why it is wired this way: docs/209-ci-workflow-notes.md.

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

# A superseded head's matrix run is cancelled; 'main' and release runs keep every run. See
# docs/209-ci-workflow-notes.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'release' }}

jobs:
  build:
    # Named off 'matrix.id' alone so the check name stays stable when a matrix
    # key is added or reordered.
    name: ${{ matrix.id }} (${{ matrix.os }})
    strategy:
      matrix:
        # 'id' is the slug used in artifact names and step conditions; a target
        # is not usable as one. See docs/209-ci-workflow-notes.md.
        include:
          - target: iosSimulatorArm64Test
            id: ios-simulator-arm64-test
            os: macos-latest
          - target: macosArm64Test
            id: macos-arm64-test
            os: macos-latest
          - target: tvosSimulatorArm64Test
            id: tvos-simulator-arm64-test
            os: macos-latest
          - target: watchosSimulatorArm64Test
            id: watchos-simulator-arm64-test
            os: macos-latest
          - target: jvmTest
            id: jvm-test
            os: ubuntu-latest
          - target: linuxX64Test
            id: linux-x64-test
            os: ubuntu-latest
          - target: jsTest
            id: js-test
            os: ubuntu-latest
          - target: wasmJsTest
            id: wasm-js-test
            os: ubuntu-latest
          - target: mingwX64Test
            id: mingw-x64-test
            os: windows-latest
          # Not a task KGP registers: ':kiban' registers it itself and runs the
          # binary under the toolchain's emulator.
          - target: linuxArm64Test
            id: linux-arm64-test
            os: ubuntu-latest
          # checkKotlinAbi builds a klib for every target the host supports, so
          # it doubles as the compile check for the Apple targets.
          - target: checkKotlinAbi
            id: api-check
            os: macos-latest
          - target: assembleAndroidMain androidCompileLintChecks :kiban:testAndroidHostTest
            id: android
            os: ubuntu-latest
          # Generation only, no deploy: catches broken KDoc/sourceLink before a
          # release tag is cut. Actual publish to GitHub Pages stays in publish.yml.
          - target: :kiban:dokkaGeneratePublicationHtml
            id: dokka
            os: ubuntu-latest
          - target: ktfmtCheck
            id: ktfmt-check
            os: ubuntu-latest
          - target: :samples:jvm-cli:run
            id: samples-jvm-cli-run
            os: ubuntu-latest
          # Assembles the XCFramework the Swift sample consumes; the step below
          # compiles and runs the sample against it.
          - target: :kiban:assembleKibanDebugXCFramework
            id: swift-console
            os: macos-latest
          # Publishes what the step below consumes. Four publications rather than
          # the aggregate 'publishToMavenLocal', which would need an Android SDK
          # and a macOS runner to check something that is about metadata.
          - target: >-
              -Pkiban.signPublications=false
              :kiban:publishKotlinMultiplatformPublicationToMavenLocal
              :kiban:publishJvmPublicationToMavenLocal
              :kiban:publishLinuxX64PublicationToMavenLocal
              :kiban:publishJsPublicationToMavenLocal
            id: consumption-probe
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/cache-konan

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Only write to the cache for builds on the 'main' and 'release' branches. (Default is 'main' only.)
        # Builds on other branches will only read existing entries from the cache.
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        # Publishes a PUBLIC build scan per job to scans.gradle.com. Only this
        # workflow is scanned; see docs/209-ci-workflow-notes.md for what is
        # uploaded and why the action inputs rather than the settings plugin.
        build-scan-publish: true
        build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
        build-scan-terms-of-use-agree: 'yes'

    - name: Build with Gradle
      # 'shell: bash' enables pipefail, so tee does not mask a Gradle failure.
      # The log is the only output for targets that write no report of their own.
      shell: bash
      run: |
        mkdir -p build/reports/ci
        ./gradlew ${{ matrix.target }} 2>&1 | tee build/reports/ci/gradle-build.log

    # A build of its own, so it resolves kiban by coordinates rather than being
    # substituted back to ':kiban'. See samples/consumption-probe.
    - name: Resolve the published artifact from an independent build
      if: matrix.id == 'consumption-probe'
      shell: bash
      run: ./gradlew -p samples/consumption-probe check 2>&1 | tee -a build/reports/ci/gradle-build.log

    # The sample is a Swift Package Manager build outside Gradle, resolving the
    # binary target out of git-ignored 'Frameworks/'. Same three lines as
    # samples/README.md and 'ios-interop-verify.yml'.
    - name: Build and run samples/swift-console
      if: matrix.id == 'swift-console'
      shell: bash
      run: |
        mkdir -p samples/swift-console/Frameworks
        cp -R kiban/build/XCFrameworks/debug/Kiban.xcframework samples/swift-console/Frameworks/
        cd samples/swift-console
        swift run SwiftConsole

    # Renders the JUnit XML Gradle already writes into this job's summary and
    # annotates failing tests. Every input below is explained in
    # docs/209-ci-workflow-notes.md.
    - name: Report test results
      # Jobs that write no test XML skip the step rather than report an empty
      # suite.
      if: always() && hashFiles('**/build/test-results/**/*.xml') != ''
      # Reporting is a convenience wrapped around the real signal; it must never
      # fail the job, nor latch 'failure()' for the steps below.
      continue-on-error: true
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: '**/build/test-results/**/*.xml'
        check_name: 'Tests: ${{ matrix.id }}'
        annotate_only: true
        detailed_summary: true
        group_suite: true
        # Counts on green, the grouped failure listing on red; the full listing
        # is a download away in the 'test-results-*' artifact.
        include_passed: false
        # The Gradle step has already failed the job by this point.
        fail_on_failure: false
        require_tests: false

    # Unlike 'Upload failure reports' below, this runs on green too: it is what
    # the 'ci' job aggregates into a single summary.
    - name: Upload test results
      if: always() && hashFiles('**/build/test-results/**/*.xml') != ''
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.id }}
        path: '**/build/test-results/**/*.xml'
        retention-days: 7

    - name: Upload API docs preview
      if: matrix.id == 'dokka'
      uses: actions/upload-artifact@v7
      with:
        name: api-docs-preview
        path: kiban/build/dokka/html
        retention-days: 7

    - name: Generate ktfmt diff
      # ktfmtCheck fails with a bare file list; re-formatting turns that into an
      # applicable patch, rendered into the job summary as well as uploaded.
      if: failure() && matrix.id == 'ktfmt-check'
      shell: bash
      run: |
        ./gradlew ktfmtFormat || true
        mkdir -p build/reports/ktfmt
        git diff > build/reports/ktfmt/ktfmt.patch
        {
          echo '## ktfmt'
          echo
          echo 'Run `./gradlew ktfmtFormat` to apply this, or download the'
          echo '`reports-ktfmt-check-ubuntu-latest` artifact and `git apply ktfmt.patch`.'
          echo
          echo '```diff'
          # The step summary is capped at 1 MiB; the artifact holds the rest.
          head -n 400 build/reports/ktfmt/ktfmt.patch
          echo '```'
          if [ "$(wc -l < build/reports/ktfmt/ktfmt.patch)" -gt 400 ]; then
            echo '_Truncated to the first 400 lines; the full patch is in the artifact._'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Generate API dump diff
      # Regenerating the dump surfaces what checkKotlinAbi buries in its log
      # tail - what the dump would have to become - as a reviewable diff.
      if: failure() && matrix.id == 'api-check'
      shell: bash
      run: |
        ./gradlew updateKotlinAbi || true
        mkdir -p build/reports/api-dump
        git diff > build/reports/api-dump/api-dump.patch
        {
          echo '## API dump'
          echo
          echo 'If the change is intended, run `./gradlew updateKotlinAbi` and commit'
          echo 'the updated dump files. If it is not, it is a binary-compatibility break.'
          echo
          echo '```diff'
          head -n 400 build/reports/api-dump/api-dump.patch
          echo '```'
          if [ "$(wc -l < build/reports/api-dump/api-dump.patch)" -gt 400 ]; then
            echo '_Truncated to the first 400 lines; the full patch is in the artifact._'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload failure reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: reports-${{ matrix.id }}-${{ matrix.os }}
        path: |
          **/build/reports/**
          **/build/test-results/**
          **/build/api/**
          !**/build/reports/configuration-cache/**
        # Not every target writes every kind of report.
        if-no-files-found: ignore
        retention-days: 7

  # The single check a branch ruleset should require: 'needs' on a matrix job
  # waits for every entry. See docs/209-ci-workflow-notes.md.
  ci:
    name: CI
    needs: build
    # Without 'always()' the gate is skipped when a matrix entry fails, and a
    # required check that never reports leaves the pull request waiting.
    if: always()
    runs-on: ubuntu-latest
    steps:
    # A roll-up of every matrix job's JUnit XML, on the one job a reviewer is
    # certain to open. Both steps are 'continue-on-error' on purpose: this job
    # is the single required check, so a bad parse must cost the summary only.
    - name: Download test results
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: test-results-*
        path: test-results

    - name: Summarise test results
      if: always()
      continue-on-error: true
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: 'test-results/**/*.xml'
        check_name: 'Test results (all targets)'
        annotate_only: true
        # The matrix jobs have already annotated their own failures.
        skip_annotations: true
        detailed_summary: true
        group_suite: true
        # Failures only; the per-target listings live on the matrix jobs.
        include_passed: false
        fail_on_failure: false
        require_tests: false

    - name: Check matrix result
      # The combined result of all matrix entries: 'success' only when every one
      # of them succeeded.
      if: always()
      run: |
        echo "Build matrix result: ${{ needs.build.result }}"
        test "${{ needs.build.result }}" = "success"
