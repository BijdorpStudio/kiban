# Main workflow for checking pull requests and merges.
# Why it is wired this way: docs/ci-workflow-notes.md.

# Named 'CI' rather than the starter template's "Java CI with Gradle" it carried until #224: this
# name is what the README badge and the pull request check list show, and what this workflow checks
# is a Kotlin Multiplatform library whose JVM target is one of sixteen. The 'ci' job below keeps
# the name it has - it is the single required status check, and renaming it would stop satisfying
# the branch ruleset without anything going red - so the check list reads "CI / CI".
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

# A superseded head's matrix run is cancelled; 'main' and release runs keep every run. See
# docs/ci-workflow-notes.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'release' }}

jobs:
  build:
    # Named off 'matrix.id' alone so the check name stays stable when a matrix
    # key is added or reordered.
    name: ${{ matrix.id }} (${{ matrix.os }})
    strategy:
      matrix:
        # 'id' is the slug used in artifact names and step conditions; a target
        # is not usable as one. See docs/ci-workflow-notes.md.
        include:
          # Everything that costs seconds once Gradle is configured, in one
          # Linux job (#220). As five separate matrix entries these paid five
          # checkouts, five JDK installs, five Gradle cache restores and five
          # configuration phases to run tasks that finish in seconds.
          #
          # 'checkKotlinAbi' is here rather than on a macOS runner because a
          # klib needs no Xcode: a Linux host compiles every Apple target and
          # dumps its ABI (#182, see CLAUDE.md), so this entry is still the
          # compile check for the Apple targets, and for 'linuxArm64', which
          # no machine can both build and run (#218).
          #
          # Dokka is generation only, no deploy: it catches broken KDoc or
          # sourceLink before a release tag is cut. The actual publish to GitHub
          # Pages stays in 'publish.yml'.
          #
          # '--continue' keeps what the split gave. One Gradle invocation stops
          # at the first failing task by default, so without it a ktfmt
          # violation would hide the ABI and Dokka results behind it - five jobs
          # reported independently and this has to as well.
          - target: >-
              --continue
              jvmTest
              checkKotlinAbi
              ktfmtCheck
              :kiban:dokkaGeneratePublicationHtml
              :samples:jvm-cli:run
            id: checks
            os: ubuntu-latest
          # The four Apple test tasks in one macOS job (#220). They shared
          # nothing as four entries and each paid its own konan distribution
          # restore and configuration phase, on the runner that is the matrix's
          # long pole.
          #
          # Per-target results survive the merge: Kotlin suffixes every suite
          # name with its target ('IbanTest[iosSimulatorArm64]'), and the JUnit
          # report action groups by suite. '--continue' is what gets all four
          # into that report on a run where one of them fails.
          - target: >-
              --continue
              iosSimulatorArm64Test
              macosArm64Test
              tvosSimulatorArm64Test
              watchosSimulatorArm64Test
            id: apple-tests
            os: macos-latest
          - target: linuxX64Test
            id: linux-x64-test
            os: ubuntu-latest
          - target: jsTest
            id: js-test
            os: ubuntu-latest
          - target: wasmJsTest
            id: wasm-js-test
            os: ubuntu-latest
          - target: mingwX64Test
            id: mingw-x64-test
            os: windows-latest
          - target: assembleAndroidMain androidCompileLintChecks :kiban:testAndroidHostTest
            id: android
            os: ubuntu-latest
          # Assembles the XCFramework the Swift sample consumes; the step below
          # compiles and runs the sample against it.
          - target: :kiban:assembleKibanDebugXCFramework
            id: swift-console
            os: macos-latest
          # Publishes what the step below consumes. Four publications rather than
          # the aggregate 'publishToMavenLocal', which would need an Android SDK
          # and a macOS runner to check something that is about metadata.
          - target: >-
              -Pkiban.signPublications=false
              :kiban:publishKotlinMultiplatformPublicationToMavenLocal
              :kiban:publishJvmPublicationToMavenLocal
              :kiban:publishLinuxX64PublicationToMavenLocal
              :kiban:publishJsPublicationToMavenLocal
            id: consumption-probe
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    # Without this a job inherits GitHub's six-hour default. The slowest entry on a
    # warm cache is the iOS simulator test at about four minutes, so half an hour
    # leaves room for a cold Kotlin/Native download and still means that an entry
    # past it is stuck - an unbooted simulator, a test runner waiting on a socket,
    # the qemu-emulated linuxArm64 binary that never exits. The cap matters most off
    # 'main': the concurrency group above is keyed on the ref, so one hung job holds
    # up every later push to that branch.
    timeout-minutes: 30

    steps:
    # Checkout stays here rather than inside the setup action: a local action is
    # resolved out of the workspace, so it cannot be found before the checkout
    # that creates it.
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-build
      with:
        # Only write to the cache for builds on 'main'; every other ref - pull request branches,
        # and the release tags this workflow sees through 'workflow_call' - reads the entries that
        # build wrote and writes nothing back. The expression also exempted 'refs/heads/release'
        # until #224; no such branch exists in this repository, so that half matched nothing.
        # It restates the action's own default, and is kept explicit because the write policy is
        # worth reading at the call site rather than in the action's documentation.
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        # Publishes a PUBLIC build scan per job to scans.gradle.com. Only this
        # workflow is scanned; see docs/ci-workflow-notes.md for what is
        # uploaded and why the action inputs rather than the settings plugin.
        build-scan: true

    - name: Build with Gradle
      # 'shell: bash' enables pipefail, so tee does not mask a Gradle failure.
      # The log is the only output for targets that write no report of their own.
      shell: bash
      run: |
        mkdir -p build/reports/ci
        ./gradlew ${{ matrix.target }} 2>&1 | tee build/reports/ci/gradle-build.log

    # A build of its own, so it resolves kiban by coordinates rather than being
    # substituted back to ':kiban'. See samples/consumption-probe.
    - name: Resolve the published artifact from an independent build
      if: matrix.id == 'consumption-probe'
      shell: bash
      run: ./gradlew -p samples/consumption-probe check 2>&1 | tee -a build/reports/ci/gradle-build.log

    # The sample is a Swift Package Manager build outside Gradle, resolving the
    # binary target out of git-ignored 'Frameworks/'. Same three lines as
    # samples/README.md and 'ios-interop-verify.yml'.
    - name: Build and run samples/swift-console
      if: matrix.id == 'swift-console'
      shell: bash
      run: |
        mkdir -p samples/swift-console/Frameworks
        cp -R kiban/build/XCFrameworks/debug/Kiban.xcframework samples/swift-console/Frameworks/
        cd samples/swift-console
        swift run SwiftConsole

    # Renders the JUnit XML Gradle already writes into this job's summary and
    # annotates failing tests. Every input below is explained in
    # docs/ci-workflow-notes.md.
    - name: Report test results
      # Jobs that write no test XML skip the step rather than report an empty
      # suite; 'swift-console' is the only one.
      if: always() && hashFiles('**/build/test-results/**/*.xml') != ''
      # Reporting is a convenience wrapped around the real signal; it must never
      # fail the job, nor latch 'failure()' for the steps below.
      continue-on-error: true
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: '**/build/test-results/**/*.xml'
        check_name: 'Tests: ${{ matrix.id }}'
        annotate_only: true
        detailed_summary: true
        group_suite: true
        # Counts on green, the grouped failure listing on red; the full listing
        # is a download away in the 'test-results-*' artifact.
        include_passed: false
        # The Gradle step has already failed the job by this point.
        fail_on_failure: false
        require_tests: false

    # Unlike 'Upload failure reports' below, this runs on green too: it is what
    # the 'ci' job aggregates into a single summary.
    - name: Upload test results
      if: always() && hashFiles('**/build/test-results/**/*.xml') != ''
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.id }}
        path: '**/build/test-results/**/*.xml'
        retention-days: 7

    - name: Upload API docs preview
      if: matrix.id == 'checks'
      uses: actions/upload-artifact@v7
      with:
        name: api-docs-preview
        path: kiban/build/dokka/html
        retention-days: 7

    # 'checks' runs five tasks, so 'matrix.id' no longer says which of them
    # failed and the two diff steps below cannot key off it any more (#220).
    # The Gradle log does say: a failing task names itself in "Execution failed
    # for task ':kiban:ktfmtCheckKmpCommonMain'". This reads the names out of
    # the log the build step teed and hands each diff step its own gate, so a
    # failing 'jvmTest' no longer drags both of them in behind it.
    - name: Identify the failing tasks
      id: failed
      if: failure() && matrix.id == 'checks'
      shell: bash
      run: |
        log=build/reports/ci/gradle-build.log
        # 'failure()' also covers a step before the build - a failed checkout or
        # JDK install leaves no log, and 'shell: bash' means '-e', so reading it
        # would fail this step on top of the one that actually broke.
        if [ ! -f "$log" ]; then
          echo 'No Gradle log: the build never ran.'
          exit 0
        fi
        tasks=$(sed -n "s/.*Execution failed for task '\([^']*\)'.*/\1/p" \
          "$log" | sort -u | tr '\n' ' ')
        echo "Failing tasks: ${tasks:-<none reported>}"
        # Substring matches, not exact names: ktfmt fails in a per-source-set
        # 'ktfmtCheckKmp*' task rather than the 'ktfmtCheck' lifecycle task, and
        # the ABI check is reachable as both 'checkKotlinAbi' and the deprecated
        # 'checkLegacyAbi' alias.
        case "$tasks" in
          *ktfmtCheck*) echo 'ktfmt=true' >> "$GITHUB_OUTPUT" ;;
        esac
        case "$tasks" in
          *Abi*) echo 'api=true' >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Generate ktfmt diff
      # ktfmtCheck fails with a bare file list; re-formatting turns that into an
      # applicable patch, rendered into the job summary as well as uploaded.
      if: failure() && steps.failed.outputs.ktfmt == 'true'
      shell: bash
      run: |
        ./gradlew ktfmtFormat || true
        mkdir -p build/reports/ktfmt
        # Scoped to Kotlin sources: both diff steps run in the same job now, and
        # an unscoped 'git diff' would put the reformatting into the API patch
        # as well (or the regenerated dumps into this one, depending on order).
        git diff -- '*.kt' '*.kts' > build/reports/ktfmt/ktfmt.patch
        {
          echo '## ktfmt'
          echo
          echo 'Run `./gradlew ktfmtFormat` to apply this, or download the'
          echo '`reports-checks-ubuntu-latest` artifact and `git apply ktfmt.patch`.'
          echo
          echo '```diff'
          # The step summary is capped at 1 MiB; the artifact holds the rest.
          head -n 400 build/reports/ktfmt/ktfmt.patch
          echo '```'
          if [ "$(wc -l < build/reports/ktfmt/ktfmt.patch)" -gt 400 ]; then
            echo '_Truncated to the first 400 lines; the full patch is in the artifact._'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Generate API dump diff
      # Regenerating the dump surfaces what checkKotlinAbi buries in its log
      # tail - what the dump would have to become - as a reviewable diff.
      if: failure() && steps.failed.outputs.api == 'true'
      shell: bash
      run: |
        ./gradlew updateKotlinAbi || true
        mkdir -p build/reports/api-dump
        # Scoped to the dump directory, for the reason the ktfmt step gives.
        git diff -- kiban/api > build/reports/api-dump/api-dump.patch
        {
          echo '## API dump'
          echo
          echo 'If the change is intended, run `./gradlew updateKotlinAbi` and commit'
          echo 'the updated dump files. If it is not, it is a binary-compatibility break.'
          echo
          echo '```diff'
          head -n 400 build/reports/api-dump/api-dump.patch
          echo '```'
          if [ "$(wc -l < build/reports/api-dump/api-dump.patch)" -gt 400 ]; then
            echo '_Truncated to the first 400 lines; the full patch is in the artifact._'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload failure reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: reports-${{ matrix.id }}-${{ matrix.os }}
        path: |
          **/build/reports/**
          **/build/test-results/**
          **/build/api/**
          !**/build/reports/configuration-cache/**
        # Not every target writes every kind of report.
        if-no-files-found: ignore
        retention-days: 7

  # The single check a branch ruleset should require: 'needs' on a matrix job
  # waits for every entry. See docs/ci-workflow-notes.md.
  ci:
    name: CI
    needs: build
    # Without 'always()' the gate is skipped when a matrix entry fails, and a
    # required check that never reports leaves the pull request waiting.
    if: always()
    runs-on: ubuntu-latest
    # Two artifact steps, both 'continue-on-error' - this job's own work is seconds.
    # The cap is for the download step hanging on a slow artifact, not for the parse:
    # 'needs: build' already bounds the wait on the matrix.
    timeout-minutes: 15
    steps:
    # A roll-up of every matrix job's JUnit XML, on the one job a reviewer is
    # certain to open. Both steps are 'continue-on-error' on purpose: this job
    # is the single required check, so a bad parse must cost the summary only.
    - name: Download test results
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: test-results-*
        path: test-results

    - name: Summarise test results
      if: always()
      continue-on-error: true
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: 'test-results/**/*.xml'
        check_name: 'Test results (all targets)'
        annotate_only: true
        # The matrix jobs have already annotated their own failures.
        skip_annotations: true
        detailed_summary: true
        group_suite: true
        # Failures only; the per-target listings live on the matrix jobs.
        include_passed: false
        fail_on_failure: false
        require_tests: false

    - name: Check matrix result
      # The combined result of all matrix entries: 'success' only when every one
      # of them succeeded.
      if: always()
      run: |
        echo "Build matrix result: ${{ needs.build.result }}"
        test "${{ needs.build.result }}" = "success"
