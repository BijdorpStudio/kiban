# Main workflow for check PRs and merges

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Named off 'matrix.id' alone, so the check name stays stable when a matrix
    # key is added or reordered. The default name interpolates *every* matrix
    # value, which is what renamed every check when 'id' was introduced.
    name: ${{ matrix.id }} (${{ matrix.os }})
    strategy:
      matrix:
        # 'id' is the slug used in artifact names and step conditions: matrix
        # targets contain spaces and colons, which are not valid in artifact
        # names, and would collide once sanitised away.
        include:
          - target: iosSimulatorArm64Test
            id: ios-simulator-arm64-test
            os: macos-latest
          - target: macosArm64Test
            id: macos-arm64-test
            os: macos-latest
          - target: tvosSimulatorArm64Test
            id: tvos-simulator-arm64-test
            os: macos-latest
          - target: watchosSimulatorArm64Test
            id: watchos-simulator-arm64-test
            os: macos-latest
          - target: jvmTest
            id: jvm-test
            os: ubuntu-latest
          - target: linuxX64Test
            id: linux-x64-test
            os: ubuntu-latest
          - target: jsTest
            id: js-test
            os: ubuntu-latest
          - target: wasmJsTest
            id: wasm-js-test
            os: ubuntu-latest
          - target: mingwX64Test
            id: mingw-x64-test
            os: windows-latest
          # linuxArm64 is the one published target with no 'linuxArm64Test' task
          # to call: Kotlin/Native has no Linux/ARM64 *host* compiler (the only
          # 'kotlin-native-prebuilt' bundles are linux-x86_64, macos-x86_64,
          # macos-aarch64 and windows-x86_64), so an 'ubuntu-24.04-arm' runner
          # cannot build the target at all, and on the x86_64 host that can
          # cross-compile it KGP registers no test task, because the host cannot
          # execute the result. Linking the test binary here and running it under
          # the emulator below is what turns the old compile-only check into a
          # real test run (#151).
          - target: linkDebugTestLinuxArm64
            id: linux-arm64-test
            os: ubuntu-latest
          # apiCheck builds a klib for every target the host supports, so it
          # doubles as the compile check for the Apple targets.
          - target: apiCheck
            id: api-check
            os: macos-latest
          - target: assembleAndroidMain androidCompileLintChecks :library:testAndroidHostTest
            id: android
            os: ubuntu-latest
          # Generation only, no deploy: catches broken KDoc/sourceLink before a
          # release tag is cut. Actual publish to GitHub Pages stays in publish.yml.
          - target: :library:dokkaGeneratePublicationHtml
            id: dokka
            os: ubuntu-latest
          - target: ktfmtCheck
            id: ktfmt-check
            os: ubuntu-latest
          - target: :samples:jvm-cli:run
            id: samples-jvm-cli-run
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/cache-konan

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Only write to the cache for builds on the 'main' and 'release' branches. (Default is 'main' only.)
        # Builds on other branches will only read existing entries from the cache.
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        # Publish a build scan per job to the public scans.gradle.com. #116
        # (docs/116-develocity-evaluation.md) chose the action inputs over the
        # 'com.gradle.develocity' settings plugin deliberately: the action injects
        # the plugin via init script, so 'settings.gradle.kts', the version catalog
        # and 'gradle.properties' stay untouched, and local plus cloud-sandbox
        # builds (see CLAUDE.md) never load it, never attempt a publish and never
        # leak a developer's machine details to a public dashboard.
        #
        # Only this workflow is scanned: it owns the 15-job matrix and therefore the
        # payoff. 'publish.yml', 'registry-sync.yml' and 'ios-interop-verify.yml'
        # also use setup-gradle but are low-frequency, and stay unscanned.
        #
        # Scans are PUBLIC. Everything uploaded originates on an ephemeral public
        # runner building a public repo — build structure, task/dependency/test data
        # and console output, no source archives and no developer environment.
        # Terms of use accepted for the project by the maintainer on #127.
        build-scan-publish: true
        build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
        build-scan-terms-of-use-agree: 'yes'

    - name: Build with Gradle
      # 'shell: bash' enables pipefail, so tee does not mask a Gradle failure.
      # The log is the only diagnosable output for targets that write no report
      # of their own (e.g. ':samples:jvm-cli:run').
      shell: bash
      run: |
        mkdir -p build/reports/ci
        ./gradlew ${{ matrix.target }} 2>&1 | tee build/reports/ci/gradle-build.log

    # What makes 'linux-arm64-test' a test job rather than a compile check: the
    # step above only links the binary, because KGP registers no test task for a
    # target the host cannot execute (see the matrix comment).
    #
    # Nothing here is installed: the emulator and the aarch64 sysroot the binary
    # is linked against are both part of the linuxArm64 toolchain the link task
    # has already downloaded, so they always match the binary. The globs absorb
    # the version each dependency carries in its directory name, and an
    # unmatched glob stays literal and fails the step rather than skipping it.
    - name: Run linuxArm64 tests under QEMU
      if: matrix.id == 'linux-arm64-test'
      shell: bash
      run: |
        konan="${KONAN_DATA_DIR:-$HOME/.konan}"
        qemu=("$konan"/dependencies/qemu-aarch64-static-*/qemu-aarch64)
        sysroot=("$konan"/dependencies/aarch64-unknown-linux-gnu-*/aarch64-unknown-linux-gnu/sysroot)
        log=build/reports/ci/linux-arm64-test.log

        # Redirected rather than tee'd: the binary emits several service messages
        # per test over a 1,500-test suite, which is an artifact to download on
        # red, not something to scroll past on green. What a failure needs is
        # printed below, and the log is uploaded with the other failure reports.
        status=0
        "${qemu[0]}" -L "${sysroot[0]}" \
          library/build/bin/linuxArm64/debugTest/test.kexe > "$log" 2>&1 || status=$?

        # The exit code is not the verdict. A Kotlin/Native test binary reports
        # through TeamCity service messages - which is what Gradle parses for
        # every target it can run directly - and exits 0 whatever the tests did.
        # So the messages are counted here instead, and a run that reports no
        # test at all counts as a failure: a binary that silently does nothing
        # must not be able to pass. The exit code still matters for the case the
        # messages cannot describe - the binary dying part-way through.
        finished=$(grep -c '##teamcity\[testFinished' "$log" || true)
        failed=$(grep -c '##teamcity\[testFailed' "$log" || true)
        # This job writes no JUnit XML, so it is skipped by the reporting steps
        # below; these counts are what a reader gets instead.
        echo "## linuxArm64 (QEMU)" >> "$GITHUB_STEP_SUMMARY"
        echo "$finished tests finished, $failed failed." >> "$GITHUB_STEP_SUMMARY"
        if [ "$status" -ne 0 ]; then
          echo "::error::The linuxArm64 test binary exited $status."
          tail -n 20 "$log"
          exit 1
        fi
        if [ "$finished" -eq 0 ]; then
          echo "::error::No linuxArm64 test ran under the emulator."
          exit 1
        fi
        if [ "$failed" -ne 0 ]; then
          echo "::error::$failed linuxArm64 test(s) failed."
          grep '##teamcity\[testFailed' "$log"
          exit 1
        fi
        echo "$finished linuxArm64 tests finished, none failed."

    # Renders the JUnit XML Gradle already writes into this job's summary, and
    # annotates failing tests on the run. 'always()' is the point of the step: a
    # green run used to report nothing but "BUILD SUCCESSFUL", which stranded the
    # per-test reporting #115 migrated to TestBalloon for.
    #
    # 'annotate_only' keeps this working under the workflow's 'contents: read'
    # token and on pull requests from forks: creating a check run instead would
    # need 'checks: write', which a fork's read-only token does not have.
    - name: Report test results
      # Half the matrix (apiCheck, dokka, ktfmt, the linuxArm64 run, the sample run)
      # writes no test XML at all; those jobs skip the step rather than report an
      # empty suite.
      if: always() && hashFiles('**/build/test-results/**/*.xml') != ''
      # Reporting is a convenience wrapped around the real signal. If the action
      # itself breaks it must not fail the job - and, because 'failure()' latches
      # for the rest of the job once any step fails, it must not make the two
      # diff steps below fire on an otherwise green run either.
      continue-on-error: true
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: '**/build/test-results/**/*.xml'
        check_name: 'Tests: ${{ matrix.id }}'
        annotate_only: true
        detailed_summary: true
        group_suite: true
        # Counts on green, the grouped failure listing on red. Listing all 1,217
        # passing tests here as well was tried and reverted: nine test jobs each
        # rendering the full per-country table buried the two numbers anyone
        # opens a summary for. The full listing is still a download away in the
        # 'test-results-*' artifact.
        include_passed: false
        # The Gradle step has already failed the job by this point. Failing again
        # here would only replace a diagnosable error with this action's own.
        fail_on_failure: false
        require_tests: false

    # Unlike 'Upload failure reports' below, this runs on green too - the XML is a
    # few hundred KB and it is what the 'ci' job aggregates into a single summary.
    # On a red run the two artifacts overlap; the failure one is still the richer
    # of the pair (HTML reports, api dumps) and stays as it is.
    - name: Upload test results
      if: always() && hashFiles('**/build/test-results/**/*.xml') != ''
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.id }}
        path: '**/build/test-results/**/*.xml'
        retention-days: 7

    - name: Upload API docs preview
      if: matrix.id == 'dokka'
      uses: actions/upload-artifact@v7
      with:
        name: api-docs-preview
        path: library/build/dokka/html
        retention-days: 7

    - name: Generate ktfmt diff
      # ktfmtCheck fails with a bare file list; re-formatting turns that into a
      # patch that can be downloaded and applied. It is also rendered into the job
      # summary, because the usual case is a handful of misformatted lines - not
      # worth a round trip through an artifact download to read.
      if: failure() && matrix.id == 'ktfmt-check'
      shell: bash
      run: |
        ./gradlew ktfmtFormat || true
        mkdir -p build/reports/ktfmt
        git diff > build/reports/ktfmt/ktfmt.patch
        {
          echo '## ktfmt'
          echo
          echo 'Run `./gradlew ktfmtFormat` to apply this, or download the'
          echo '`reports-ktfmt-check-ubuntu-latest` artifact and `git apply ktfmt.patch`.'
          echo
          echo '```diff'
          # Truncated because the step summary is capped at 1 MiB and a run that
          # blows past this is one where the artifact is the right tool anyway.
          head -n 400 build/reports/ktfmt/ktfmt.patch
          echo '```'
          if [ "$(wc -l < build/reports/ktfmt/ktfmt.patch)" -gt 400 ]; then
            echo '_Truncated to the first 400 lines; the full patch is in the artifact._'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Generate API dump diff
      # apiCheck reports a binary-compatibility break as a Gradle failure whose
      # useful part - what the dump would have to become - is buried in the log
      # tail. Regenerating the dump surfaces exactly that, as a reviewable diff.
      if: failure() && matrix.id == 'api-check'
      shell: bash
      run: |
        ./gradlew apiDump || true
        mkdir -p build/reports/api-dump
        git diff > build/reports/api-dump/api-dump.patch
        {
          echo '## API dump'
          echo
          echo 'If the change is intended, run `./gradlew apiDump` and commit the updated'
          echo 'dump files. If it is not, it is a binary-compatibility break.'
          echo
          echo '```diff'
          head -n 400 build/reports/api-dump/api-dump.patch
          echo '```'
          if [ "$(wc -l < build/reports/api-dump/api-dump.patch)" -gt 400 ]; then
            echo '_Truncated to the first 400 lines; the full patch is in the artifact._'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload failure reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: reports-${{ matrix.id }}-${{ matrix.os }}
        path: |
          **/build/reports/**
          **/build/test-results/**
          **/build/api/**
          !**/build/reports/configuration-cache/**
        # Not every target writes every kind of report; an empty match is not
        # itself a failure worth flagging.
        if-no-files-found: ignore
        retention-days: 7

  # The single check a branch ruleset should require. 'needs' on a matrix job
  # waits for every entry, so adding, renaming or removing a matrix target never
  # touches the list of required checks.
  ci:
    name: CI
    needs: build
    # 'always()' is what makes this usable as a required check: without it the
    # gate is skipped whenever a matrix entry fails, and a required check that
    # never reports leaves the PR waiting forever instead of going red.
    if: always()
    runs-on: ubuntu-latest
    steps:
    # A roll-up of every matrix job's JUnit XML, on the one job a reviewer is
    # certain to open. Suite names carry their target ('IbanTest[jvm]',
    # 'IbanTest[iosSimulatorArm64]', ...), so grouping by suite attributes each
    # result without the 15 jobs having to be listed out here.
    #
    # Both steps are 'continue-on-error' on purpose. This job is the single
    # required check; a missing artifact or a bad parse has to cost the summary
    # and nothing else, and must never be able to turn a green matrix red.
    - name: Download test results
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: test-results-*
        path: test-results

    - name: Summarise test results
      if: always()
      continue-on-error: true
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: 'test-results/**/*.xml'
        check_name: 'Test results (all targets)'
        annotate_only: true
        # The matrix jobs have already annotated their own failures; repeating
        # them here would double every one of them on the pull request.
        skip_annotations: true
        detailed_summary: true
        group_suite: true
        # Failures only: the per-target listings live on the matrix jobs, and
        # every passing test across 10 targets would not fit the summary anyway.
        include_passed: false
        fail_on_failure: false
        require_tests: false

    - name: Check matrix result
      # 'needs.build.result' is the combined result of all matrix entries:
      # 'success' only when every one of them succeeded.
      if: always()
      run: |
        echo "Build matrix result: ${{ needs.build.result }}"
        test "${{ needs.build.result }}" = "success"
