# Main workflow for check PRs and merges

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Named off 'matrix.id' alone, so the check name stays stable when a matrix
    # key is added or reordered. The default name interpolates *every* matrix
    # value, which is what renamed every check when 'id' was introduced.
    name: ${{ matrix.id }} (${{ matrix.os }})
    strategy:
      matrix:
        # 'id' is the slug used in artifact names and step conditions: matrix
        # targets contain spaces and colons, which are not valid in artifact
        # names, and would collide once sanitised away.
        include:
          - target: iosSimulatorArm64Test
            id: ios-simulator-arm64-test
            os: macos-latest
          - target: macosArm64Test
            id: macos-arm64-test
            os: macos-latest
          - target: tvosSimulatorArm64Test
            id: tvos-simulator-arm64-test
            os: macos-latest
          - target: watchosSimulatorArm64Test
            id: watchos-simulator-arm64-test
            os: macos-latest
          - target: jvmTest
            id: jvm-test
            os: ubuntu-latest
          - target: linuxX64Test
            id: linux-x64-test
            os: ubuntu-latest
          - target: jsTest
            id: js-test
            os: ubuntu-latest
          - target: wasmJsTest
            id: wasm-js-test
            os: ubuntu-latest
          # Targets with no runner to execute on: cross-compile only.
          - target: compileKotlinLinuxArm64 compileKotlinMingwX64
            id: cross-compile
            os: ubuntu-latest
          # apiCheck builds a klib for every target the host supports, so it
          # doubles as the compile check for the Apple targets.
          - target: apiCheck
            id: api-check
            os: macos-latest
          - target: assembleAndroidMain androidCompileLintChecks :library:testAndroidHostTest
            id: android
            os: ubuntu-latest
          # Generation only, no deploy: catches broken KDoc/sourceLink before a
          # release tag is cut. Actual publish to GitHub Pages stays in publish.yml.
          - target: :library:dokkaGeneratePublicationHtml
            id: dokka
            os: ubuntu-latest
          - target: ktfmtCheck
            id: ktfmt-check
            os: ubuntu-latest
          - target: :samples:jvm-cli:run
            id: samples-jvm-cli-run
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/cache@v6
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Only write to the cache for builds on the 'main' and 'release' branches. (Default is 'main' only.)
        # Builds on other branches will only read existing entries from the cache.
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Build with Gradle
      # 'shell: bash' enables pipefail, so tee does not mask a Gradle failure.
      # The log is the only diagnosable output for targets that write no report
      # of their own (e.g. ':samples:jvm-cli:run').
      shell: bash
      run: |
        mkdir -p build/reports/ci
        ./gradlew ${{ matrix.target }} 2>&1 | tee build/reports/ci/gradle-build.log

    - name: Upload API docs preview
      if: matrix.id == 'dokka'
      uses: actions/upload-artifact@v7
      with:
        name: api-docs-preview
        path: library/build/dokka/html
        retention-days: 7

    - name: Generate ktfmt diff
      # ktfmtCheck fails with a bare file list; re-formatting turns that into a
      # patch that can be downloaded and applied.
      if: failure() && matrix.id == 'ktfmt-check'
      shell: bash
      run: |
        ./gradlew ktfmtFormat || true
        mkdir -p build/reports/ktfmt
        git diff > build/reports/ktfmt/ktfmt.patch

    - name: Upload failure reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: reports-${{ matrix.id }}-${{ matrix.os }}
        path: |
          **/build/reports/**
          **/build/test-results/**
          **/build/api/**
          !**/build/reports/configuration-cache/**
        # Not every target writes every kind of report; an empty match is not
        # itself a failure worth flagging.
        if-no-files-found: ignore
        retention-days: 7

  # The single check a branch ruleset should require. 'needs' on a matrix job
  # waits for every entry, so adding, renaming or removing a matrix target never
  # touches the list of required checks.
  ci:
    name: CI
    needs: build
    # 'always()' is what makes this usable as a required check: without it the
    # gate is skipped whenever a matrix entry fails, and a required check that
    # never reports leaves the PR waiting forever instead of going red.
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check matrix result
      # 'needs.build.result' is the combined result of all matrix entries:
      # 'success' only when every one of them succeeded.
      run: |
        echo "Build matrix result: ${{ needs.build.result }}"
        test "${{ needs.build.result }}" = "success"
