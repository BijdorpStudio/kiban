# CodeQL static analysis for the Kotlin sources (#160).
#
# Nothing else in this repository looks at the code for defects: 'gradle.yml' runs the test suite,
# 'apiCheck' and 'ktfmtCheck', all of which say whether the code does what its own tests say and
# nothing about the patterns CodeQL's query packs are written to spot. For a library that parses
# untrusted strings on behalf of finance-adjacent callers - the scope SECURITY.md sets out - that
# second opinion is worth a job.
#
# This is the workflow form rather than GitHub's "default setup", deliberately: default setup
# autobuilds, and this is a Kotlin Multiplatform project whose default build touches Apple, Android
# and Native targets. Only the JVM compilation is analysable (see the build step), and saying so
# takes a build mode the UI does not offer.

name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Code scanning results go stale from the query side, not just the code side: a pack published
  # after the last commit here would otherwise never run against this repository. Weekly, on a
  # minute nobody else picked, keeps the Security tab current on a repository that can go a while
  # between pushes.
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read

# Same reasoning as 'gradle.yml': a superseded commit's analysis tells nobody anything, so a new
# push to a branch or pull request cancels the run still going for the old head. 'main' keeps every
# run, because there the per-commit result is the record of what the branch was analysed as.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      # Uploading the SARIF result into the Security tab, which is the whole point of the job.
      security-events: write
      contents: read
      # 'analyze' reads this workflow run's own metadata to attach results to the right ref.
      actions: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Read-only on every ref, including 'main'. This job compiles a single target and would
          # write a cache entry covering less than the one 'gradle.yml' writes from the same
          # commit; reusing that entry is all it needs. No build scan either - #116 scoped
          # scan publishing to the matrix workflow that pays for itself.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # One language: everything here is Kotlin, and 'java-kotlin' is the analysis that covers
          # it. The Gradle scripts and the '.main.kts' scripts under 'scripts/' are not part of a
          # compilation this extractor sees, and no other language in the repository has a pack.
          languages: java-kotlin
          # The Kotlin extractor works off compiler output, so something has to compile. 'autobuild'
          # would run the default Gradle build, which on this project means Android (no SDK on this
          # runner) and the Apple targets (no Xcode). The step below builds the one target that is
          # both buildable here and made of the same 'commonMain' sources every other target shares.
          build-mode: manual

      - name: Compile the JVM target
        # 'commonMain' plus 'jvmMain'. Every other target compiles the same 'commonMain' sources
        # with a different backend, so analysing the JVM compilation covers all of the code except
        # the per-platform 'actual' declarations - a handful of files - at the cost of one job
        # instead of a second target matrix.
        run: ./gradlew :library:compileKotlinJvm
        env:
          # The extractor pins the Kotlin versions it knows how to read, and this project tracks
          # the current Kotlin release (see 'gradle/libs.versions.toml'), so it is routinely ahead
          # of that list. Without this the build fails outright on the version check rather than
          # analysing anything. The trade is real - an extractor reading a newer compiler's IR can
          # miss declarations - but a partial analysis beats a workflow that goes red on every
          # Kotlin bump until CodeQL catches up. Drop this line if the pin ever leads it.
          CODEQL_EXTRACTOR_KOTLIN_ALLOW_UNSUPPORTED_VERSION: true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
