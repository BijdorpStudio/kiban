# Scheduled SWIFT IBAN Registry sync: detects a new registry revision and opens a data-update pull
# request. The raw registry TXT is never committed; it is not redistributable. Best-effort by
# design - downloading the TXT by hand and running the generator stays the fallback.
#
# How it works, which token it needs and what a maintainer has to configure:
# docs/209-ci-workflow-notes.md. Read that before changing this.

name: SWIFT registry sync

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      rev:
        description: 'Registry revision to record, e.g. 103 (needed only once the registry data has changed)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATA_FILE: kiban/src/commonMain/kotlin/nl/bijdorpstudio/kiban/CountryCodesData.kt
      TEST_DATA_FILE: kiban/src/commonTest/kotlin/nl/bijdorpstudio/kiban/CountryTestData.kt
      REGISTRY_TXT_PATH: scripts/input/iban-registry.txt
      REV: ${{ inputs.rev }}
    steps:
      # Checked out with the token that also opens the pull request, so the branch push and the
      # pull request come from a single identity.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.REGISTRY_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check the fetch script's parsing helpers
        run: kotlin scripts/fetch_registry.main.kts --self-check

      # Before the download, not after: a generator that can no longer read the format should fail
      # against a fixture rather than against whatever the registry happens to be today.
      - name: Check the generator's parser against the synthetic registry
        run: kotlin scripts/generate_country_data.main.kts --self-check

      # Headed, with no headless attempt first: headless Chromium is blocked on the client
      # fingerprint rather than the IP, so an attempt is ~60s per run buying nothing. Do not re-add
      # it as an optimisation; see docs/209-ci-workflow-notes.md.
      - name: Download the registry TXT (headed, under Xvfb)
        run: xvfb-run -a kotlin scripts/fetch_registry.main.kts --out "$REGISTRY_TXT_PATH" --headed ${REV:+--rev "$REV"}

      # Regenerated with the committed revision and datestamp, so a run where the registry did not
      # change stays byte-identical to HEAD. ktfmt is not optional: KotlinPoet's raw output differs
      # from the committed files in whitespace alone. See docs/209-ci-workflow-notes.md.
      - name: Regenerate the country data as currently committed
        run: |
          previous_date="$(sed -n 's/.*LAST_UPDATE_DATE: String = "\(.*\)"$/\1/p' "$DATA_FILE")"
          previous_rev="$(sed -n 's/.*LAST_UPDATE_REV: String = "\(.*\)"$/\1/p' "$DATA_FILE")"
          kotlin scripts/generate_country_data.main.kts \
            --registry "$REGISTRY_TXT_PATH" --rev "$previous_rev" --date "$previous_date"
          ./gradlew --quiet :kiban:ktfmtFormatKmpCommonMain :kiban:ktfmtFormatKmpCommonTest

      - name: Check whether the generated data changed
        id: diff
        run: |
          if git diff --quiet -- "$DATA_FILE" "$TEST_DATA_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Country data is already up to date with the registry as last modified ${REGISTRY_LAST_MODIFIED:-unknown} (sha256 ${REGISTRY_SHA256})."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- "$DATA_FILE" "$TEST_DATA_FILE"
          fi

      # Only reached when the registry actually changed, which is the one case where asking a
      # human for the release number is worth the interruption.
      - name: Require a registry revision for the changed data
        if: steps.diff.outputs.changed == 'true'
        run: |
          if [ -z "${REGISTRY_REV:-}" ]; then
            echo "::error::The registry TXT changed (sha256 ${REGISTRY_SHA256}, last modified ${REGISTRY_LAST_MODIFIED:-unknown}), but its release number is not stated anywhere machine-readable. Look it up on https://www.swift.com/standards/data-standards/iban and re-run this workflow with the 'rev' input."
            exit 1
          fi
          echo "Registry changed; recording revision ${REGISTRY_REV}."

      - name: Restamp the regenerated data with today's date and revision
        if: steps.diff.outputs.changed == 'true'
        run: |
          kotlin scripts/generate_country_data.main.kts \
            --registry "$REGISTRY_TXT_PATH" --rev "$REGISTRY_REV"
          ./gradlew --quiet :kiban:ktfmtFormatKmpCommonMain :kiban:ktfmtFormatKmpCommonTest

      - name: Verify the regenerated data
        if: steps.diff.outputs.changed == 'true'
        run: ./gradlew jvmTest

      - name: Open a data-update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          # A step 'if' cannot read secrets, so which token won is resolved into an env var here
          # and branched on in the script below.
          HAS_SYNC_TOKEN: ${{ secrets.REGISTRY_SYNC_TOKEN != '' }}
        run: |
          branch="registry-sync/rev-${REGISTRY_REV}"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open; nothing to do."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          # Only the derived artifacts: the registry TXT stays out of the repository.
          git add "$DATA_FILE" "$TEST_DATA_FILE"
          git commit -m "Update IBAN country data to SWIFT registry rev ${REGISTRY_REV}"
          git push --force-with-lease -u origin "$branch"
          if [ "$HAS_SYNC_TOKEN" = 'true' ]; then
            ci_note='Opened with `REGISTRY_SYNC_TOKEN`, so this pull request gets a full CI run of its own.'
          else
            ci_note='CI does not run automatically on pull requests opened by `GITHUB_TOKEN`, and `REGISTRY_SYNC_TOKEN` is not configured - close and reopen this pull request to get a full run before merging.'
          fi
          body="$(printf '%s\n' \
            "Generated by the [SWIFT registry sync workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." \
            "" \
            "- Registry revision: \`$REGISTRY_REV\`" \
            "- Registry TXT last modified: \`${REGISTRY_LAST_MODIFIED:-unknown}\`" \
            "- Registry TXT sha256: \`$REGISTRY_SHA256\`" \
            "" \
            "The registry TXT itself is not committed (it is not redistributable); only the files" \
            "generated from it by \`scripts/generate_country_data.main.kts\` are. The generator's" \
            "validation (mod-97, declared lengths, bank/branch identifier cross-checks) and" \
            "\`./gradlew jvmTest\` both passed against the regenerated data." \
            "" \
            "$ci_note")"
          gh pr create --base main --head "$branch" \
            --title "Update IBAN country data to SWIFT registry rev $REGISTRY_REV" \
            --body "$body"
