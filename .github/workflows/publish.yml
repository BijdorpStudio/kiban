# Workflow to publish the library to Maven central

name: Publish
on:
  release:
    types: [released, prereleased]
jobs:
  # Run the full check matrix (tests on every target plus apiCheck) before publishing anything.
  test:
    name: Check
    uses: ./.github/workflows/gradle.yml
    secrets: inherit

  publish:
    name: Release build and publish
    needs: test
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only write to the cache for builds on the 'main' and 'release' branches. (Default is 'main' only.)
          # Builds on other branches will only read existing entries from the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Publish to MavenCentral
        # kotlin.native.ignoreDisabledTargets stays "true" in gradle.properties for local dev and
        # PR CI, where no single host builds every target. Forced "false" here so a target this
        # runner can't build fails the build instead of silently shipping a partial artifact set.
        run: ./gradlew publishToMavenCentral --no-configuration-cache -Pkotlin.native.ignoreDisabledTargets=false
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

  docs:
    name: Publish API docs
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Dokka HTML
        run: ./gradlew :library:dokkaGeneratePublicationHtml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: library/build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
