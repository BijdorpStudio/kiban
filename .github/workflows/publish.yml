# Workflow to publish the library to Maven central

name: Publish
on:
  release:
    types: [released, prereleased]

# Least privilege for every job in this workflow. Without this the GITHUB_TOKEN falls back to the
# repository default, which is read-write for repositories created before February 2023 — and the
# 'publish' job runs with the Maven Central and GPG signing secrets in scope. The 'docs' job
# widens this for its Pages deployment; nothing else here needs more than read.
permissions:
  contents: read

jobs:
  # Fail fast, before the full check matrix and the publish job spin up, if the release tag does
  # not match the version the build script declares. publish.yml fires on any 'released'/
  # 'prereleased' event and ships whatever the checked-out build says, so tagging 'v1.0.0' against
  # a commit still declaring 0.6.0 would silently (re)publish 0.6.0 — and only fail late at Maven
  # Central, if at all. This guard turns that into an immediate, obvious failure.
  verify-version:
    name: Verify tag matches project version
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Compare release tag to Gradle version
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # The version is a plain literal in the build script, so it is read directly rather than
          # by booting Gradle: this step exists to fail fast, and resolving the project the slow way
          # would defeat that. The pattern anchors on the top-level 'version = "..."' assignment.
          project_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' library/build.gradle.kts)"
          if [ -z "$project_version" ]; then
            echo "::error::Could not read the project version from library/build.gradle.kts."
            exit 1
          fi
          # Release tags are 'vX.Y.Z'; the Gradle version is 'X.Y.Z'. Strip a single leading 'v'.
          tag_version="${TAG_NAME#v}"
          echo "Release tag:     $TAG_NAME (version $tag_version)"
          echo "Project version: $project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Release tag '$TAG_NAME' does not match the project version '$project_version' in library/build.gradle.kts. Bump the version and re-tag (see RELEASING.md)."
            exit 1
          fi
          echo "Release tag and project version match."

  # Run the full check matrix (tests on every target plus apiCheck) before publishing anything.
  test:
    name: Check
    needs: verify-version
    uses: ./.github/workflows/gradle.yml
    secrets: inherit

  publish:
    name: Release build and publish
    needs: test
    runs-on: macOS-latest
    # The only job holding the Maven Central credentials and the GPG signing key. Binding it to a
    # GitHub environment is what makes that scoping enforceable: the secrets can live on the
    # 'release' environment instead of the repository, so no other workflow or job can read them,
    # and the environment's required reviewers turn "a release was created" into "a human approved
    # this publish". Creating a release stays the trigger; it stops being sufficient on its own.
    # The environment and its protection rules are repository settings, not workflow content — see
    # RELEASING.md for what has to be configured for this to gate anything.
    environment:
      name: release
      url: https://central.sonatype.com/artifact/nl.bijdorpstudio.kiban/kiban
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # 'publishToMavenCentral' runs with '-Pkotlin.native.ignoreDisabledTargets=false',
      # so this job compiles every native target and needs the whole Kotlin/Native
      # distribution.
      - uses: ./.github/actions/cache-konan

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # This workflow only ever runs on a release tag ref, never on 'main' or 'release', so the
          # cache is always read-only here. It reuses entries the 'main' CI build wrote; a one-shot
          # release build has nothing worth writing back.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Publish to MavenCentral
        # kotlin.native.ignoreDisabledTargets stays "true" in gradle.properties for local dev and
        # PR CI, where no single host builds every target. Forced "false" here so a target this
        # runner can't build fails the build instead of silently shipping a partial artifact set.
        run: ./gradlew publishToMavenCentral --no-configuration-cache -Pkotlin.native.ignoreDisabledTargets=false
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

  docs:
    name: Publish API docs
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Dokka resolves 'nativeMain'/'appleMain' through the Kotlin analysis
      # frontend, so this job downloads the Kotlin/Native distribution as well --
      # see the action's own comment.
      - uses: ./.github/actions/cache-konan

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Release-tag ref only, so the cache is read-only here as well; see the publish job.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Dokka HTML
        run: ./gradlew :library:dokkaGeneratePublicationHtml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: library/build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
