# Publishes the library to Maven Central, then the API docs to GitHub Pages.
# Why it is wired this way: docs/209-ci-workflow-notes.md.

name: Publish
on:
  release:
    types: [released, prereleased]

# Least privilege for every job here; 'docs' and 'archive-docs' widen it for themselves.
permissions:
  contents: read

jobs:
  # Fails fast, before the check matrix and the publish job spin up, if the release tag does not
  # match the version the build declares.
  verify-version:
    name: Verify tag matches project version
    runs-on: ubuntu-latest
    # A checkout and a 'sed'. This exists to fail fast, so anything beyond a few minutes here is
    # the runner, not the check.
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare release tag to Gradle version
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Read straight out of the properties file rather than by booting Gradle, because this
          # step exists to fail fast.
          project_version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [ -z "$project_version" ]; then
            echo "::error::Could not read VERSION_NAME from gradle.properties."
            exit 1
          fi
          # Release tags are 'vX.Y.Z'; the Gradle version is 'X.Y.Z'. Strip a single leading 'v'.
          tag_version="${TAG_NAME#v}"
          echo "Release tag:     $TAG_NAME (version $tag_version)"
          echo "Project version: $project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Release tag '$TAG_NAME' does not match the project version '$project_version' in gradle.properties. Bump VERSION_NAME and re-tag (see RELEASING.md)."
            exit 1
          fi
          echo "Release tag and project version match."

  # The full check matrix (tests on every target plus checkKotlinAbi), before anything is shipped.
  # No 'timeout-minutes': GitHub rejects the key on a 'uses:' job, and every job in gradle.yml
  # carries its own.
  test:
    name: Check
    needs: verify-version
    uses: ./.github/workflows/gradle.yml
    secrets: inherit

  publish:
    name: Release build and publish
    needs: test
    runs-on: macOS-latest
    # The long pole: a release build of every target on a macOS runner, signing, the Sonatype
    # upload and the attestation. 45 rather than the matrix's 30 because a cold konan cache, a
    # slow Central staging repository or a Sigstore round trip all land on this one job - and
    # because dying halfway through an upload is worse than taking a while.
    timeout-minutes: 45
    permissions:
      contents: read
      # Build provenance for the published artifacts; see docs/209-ci-workflow-notes.md. Neither
      # widens what the job can do to the repository's contents.
      attestations: write
      id-token: write
    # The only job holding the Maven Central credentials and the GPG signing key. The 'release'
    # environment is what scopes those secrets and gates the publish on a human; it is a
    # repository setting rather than workflow content, so see RELEASING.md and
    # docs/209-ci-workflow-notes.md.
    environment:
      name: release
      url: https://central.sonatype.com/artifact/nl.bijdorpstudio.kiban/kiban
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs the whole Gradle build with the signing key and the Central token in
          # its environment; it does not need a git credential on top. Nothing here pushes -
          # 'archive-docs' is the only job that does, with the token it is handed explicitly
          # (#222).
          persist-credentials: false

      # This job compiles every native target, so it needs the whole Kotlin/Native distribution.
      - uses: ./.github/actions/cache-konan

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Release-tag ref only, so the cache is read-only: a one-shot release build has nothing
          # worth writing back.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Publish to MavenCentral
        # Forced "false" here so a target this runner cannot build fails the build instead of
        # silently shipping a partial artifact set.
        run: ./gradlew publishToMavenCentral --no-configuration-cache -Pkotlin.native.ignoreDisabledTargets=false
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

      # Attestation needs the published files as subjects under a single path, which only a
      # repository layout gives. A second write of what the publish already built, not a second
      # build; see docs/209-ci-workflow-notes.md.
      - name: Stage the published artifacts for attestation
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
        run: |
          ./gradlew :kiban:publishToMavenLocal --no-configuration-cache \
            -Pkotlin.native.ignoreDisabledTargets=false \
            -Dmaven.repo.local="$GITHUB_WORKSPACE/build/attestation-staging"
          # An empty tree would make the attest step fail with "no subjects found", so it fails
          # here instead, where the cause is visible. '|| true' because a missing staging
          # directory is one of the two cases this check exists to report.
          staged="$(find build/attestation-staging/nl/bijdorpstudio/kiban \
            -type f \( -name '*.jar' -o -name '*.klib' -o -name '*.aar' \) 2>/dev/null | wc -l || true)"
          echo "Staged $staged artifact files for attestation."
          if [ "$staged" -eq 0 ]; then
            echo "::error::Nothing was staged under build/attestation-staging. The publication layout changed, or Gradle ignored '-Dmaven.repo.local'."
            exit 1
          fi

      # Binaries only: a consumer runs 'gh attestation verify' on what lands on their classpath,
      # not on the '.pom' and '.module' metadata. See docs/209-ci-workflow-notes.md.
      - name: Attest build provenance for the published artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/attestation-staging/nl/bijdorpstudio/kiban/**/*.jar
            build/attestation-staging/nl/bijdorpstudio/kiban/**/*.klib
            build/attestation-staging/nl/bijdorpstudio/kiban/**/*.aar

  docs:
    name: Publish API docs
    needs: publish
    runs-on: macos-latest
    # A full Dokka generation plus the Pages deployment, and the deploy waits on GitHub's own
    # pages-build-deployment run. Generous because it is the release path: a timeout here means
    # the artifacts published but the docs did not.
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The versions already published, kept on the 'docs-archive' branch by the job below.
      # 'continue-on-error' covers the branch not existing yet; the generate step then falls
      # through to a single-version site.
      - name: Restore previously published doc versions
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs-archive
          path: docs-archive
          persist-credentials: false

      # Dokka resolves 'nativeMain'/'appleMain' through the Kotlin analysis frontend, so this job
      # needs the Kotlin/Native distribution too.
      - uses: ./.github/actions/cache-konan

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Release-tag ref only, so the cache is read-only here as well; see the publish job.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Dokka HTML
        shell: bash
        run: |
          # The property is only passed when there is an archive to merge in; omitting it is the
          # documented way to ask for the plain single-version site.
          older="$GITHUB_WORKSPACE/docs-archive/versions"
          if [ -d "$older" ] && [ -n "$(ls -A "$older")" ]; then
            echo "Archived versions being merged in: $(ls "$older" | tr '\n' ' ')"
            ./gradlew :kiban:dokkaGeneratePublicationHtml -Pkiban.previousDocVersions="$older"
          else
            echo "No archived versions restored; generating a single-version site."
            ./gradlew :kiban:dokkaGeneratePublicationHtml
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: kiban/build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Adds the version just published to the archive the 'docs' job restores from. A job of its own
  # because 'contents: write' must not sit on a job that runs the Gradle build; see
  # docs/209-ci-workflow-notes.md.
  archive-docs:
    name: Archive published API docs
    needs: docs
    runs-on: ubuntu-latest
    # Downloads one Pages artifact, rearranges files and pushes them - it runs no project code.
    # The cap guards the artifact download and the push to the docs branch.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the deployed Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: pages-artifact

      - name: Rebuild the docs archive branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # 'verify-version' has already established that the tag and the project version agree.
          version="${TAG_NAME#v}"

          mkdir -p site archive/versions
          tar -xf pages-artifact/artifact.tar -C site

          # Everything under 'older/' was already archived; carry it over so the branch stays the
          # complete set.
          if [ -d site/older ]; then
            for dir in site/older/*/; do
              [ -d "$dir" ] || continue
              cp -R "$dir" "archive/versions/$(basename "${dir%/}")"
            done
          fi

          # The root holds the version just published. Its own 'older/' is dropped, or every past
          # version would nest inside every future one.
          rm -rf site/older
          cp -R site "archive/versions/$version"

          echo "Archive now holds: $(ls archive/versions | tr '\n' ' ')"

          # A snapshot, not a history: a fresh single-commit repository, force-pushed, so past
          # releases' copies never linger as dangling objects. Only the tip is ever read.
          cd archive
          git init -q -b docs-archive
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Archive API docs for $version"
          git push -q --force \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" docs-archive
