# Workflow to publish the library to Maven central

name: Publish
on:
  release:
    types: [released, prereleased]

# Least privilege for every job in this workflow. Without this the GITHUB_TOKEN falls back to the
# repository default, which is read-write for repositories created before February 2023 — and the
# 'publish' job runs with the Maven Central and GPG signing secrets in scope. The 'docs' job
# widens this for its Pages deployment and 'archive-docs' for the branch it pushes; nothing else
# here needs more than read.
permissions:
  contents: read

jobs:
  # Fail fast, before the full check matrix and the publish job spin up, if the release tag does
  # not match the version the build script declares. publish.yml fires on any 'released'/
  # 'prereleased' event and ships whatever the checked-out build says, so tagging 'v1.0.0' against
  # a commit still declaring 0.6.0 would silently (re)publish 0.6.0 — and only fail late at Maven
  # Central, if at all. This guard turns that into an immediate, obvious failure.
  verify-version:
    name: Verify tag matches project version
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Compare release tag to Gradle version
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # The version is a plain literal in the build script, so it is read directly rather than
          # by booting Gradle: this step exists to fail fast, and resolving the project the slow way
          # would defeat that. The pattern anchors on the top-level 'version = "..."' assignment.
          project_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' library/build.gradle.kts)"
          if [ -z "$project_version" ]; then
            echo "::error::Could not read the project version from library/build.gradle.kts."
            exit 1
          fi
          # Release tags are 'vX.Y.Z'; the Gradle version is 'X.Y.Z'. Strip a single leading 'v'.
          tag_version="${TAG_NAME#v}"
          echo "Release tag:     $TAG_NAME (version $tag_version)"
          echo "Project version: $project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Release tag '$TAG_NAME' does not match the project version '$project_version' in library/build.gradle.kts. Bump the version and re-tag (see RELEASING.md)."
            exit 1
          fi
          echo "Release tag and project version match."

  # Run the full check matrix (tests on every target plus apiCheck) before publishing anything.
  test:
    name: Check
    needs: verify-version
    uses: ./.github/workflows/gradle.yml
    secrets: inherit

  publish:
    name: Release build and publish
    needs: test
    runs-on: macOS-latest
    permissions:
      contents: read
      # Build provenance for the published artifacts (#160). 'attestations: write' records the
      # attestation against this repository; 'id-token: write' is how the run proves to Sigstore
      # that it is this workflow on this commit, rather than by holding a signing key. Neither
      # widens what the job can do to the repository's contents.
      attestations: write
      id-token: write
    # The only job holding the Maven Central credentials and the GPG signing key. Binding it to a
    # GitHub environment is what makes that scoping enforceable: the secrets can live on the
    # 'release' environment instead of the repository, so no other workflow or job can read them,
    # and the environment's required reviewers turn "a release was created" into "a human approved
    # this publish". Creating a release stays the trigger; it stops being sufficient on its own.
    # The environment and its protection rules are repository settings, not workflow content — see
    # RELEASING.md for what has to be configured for this to gate anything.
    environment:
      name: release
      url: https://central.sonatype.com/artifact/nl.bijdorpstudio.kiban/kiban
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # 'publishToMavenCentral' runs with '-Pkotlin.native.ignoreDisabledTargets=false',
      # so this job compiles every native target and needs the whole Kotlin/Native
      # distribution.
      - uses: ./.github/actions/cache-konan

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # This workflow only ever runs on a release tag ref, never on 'main' or 'release', so the
          # cache is always read-only here. It reuses entries the 'main' CI build wrote; a one-shot
          # release build has nothing worth writing back.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Publish to MavenCentral
        # kotlin.native.ignoreDisabledTargets stays "true" in gradle.properties for local dev and
        # PR CI, where no single host builds every target. Forced "false" here so a target this
        # runner can't build fails the build instead of silently shipping a partial artifact set.
        run: ./gradlew publishToMavenCentral --no-configuration-cache -Pkotlin.native.ignoreDisabledTargets=false
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

      # Build provenance needs the files as subjects, and the step above uploads them without
      # leaving a single directory to point at: a Kotlin Multiplatform publication is 17 modules
      # whose artifacts sit wherever their compilation put them ('build/libs' for the JVM and
      # metadata jars, 'build/classes/kotlin/<target>/main/klib' for the Native ones, and so on).
      # Writing the same publication into a local Maven repository lays every published file out
      # under one path, in the layout Maven Central will serve it in.
      #
      # This is a second write of artifacts the publish above already built, not a second build:
      # every compile, jar and Sign task is up to date by now, so the step is the install itself
      # plus Gradle's configuration time. '-Dmaven.repo.local' keeps it inside the workspace rather
      # than in '~/.m2', which is what lets the attest step below address it with a relative glob.
      # The signing secrets are passed because 'signAllPublications()' applies to every repository,
      # so without them this publication would fail on a missing signatory.
      - name: Stage the published artifacts for attestation
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
        run: |
          ./gradlew :library:publishToMavenLocal --no-configuration-cache \
            -Pkotlin.native.ignoreDisabledTargets=false \
            -Dmaven.repo.local="$GITHUB_WORKSPACE/build/attestation-staging"
          # An empty tree here would make the attest step fail with "no subjects found", which
          # says nothing about why. Fail on the staging itself, where the cause is visible.
          # '|| true' because 'shell: bash' runs with '-e' and pipefail, and a missing staging
          # directory is one of the two cases this check exists to report - not a reason to abort
          # before it can say so.
          staged="$(find build/attestation-staging/nl/bijdorpstudio/kiban \
            -type f \( -name '*.jar' -o -name '*.klib' -o -name '*.aar' \) 2>/dev/null | wc -l || true)"
          echo "Staged $staged artifact files for attestation."
          if [ "$staged" -eq 0 ]; then
            echo "::error::Nothing was staged under build/attestation-staging. The publication layout changed, or Gradle ignored '-Dmaven.repo.local'."
            exit 1
          fi

      # What this buys a consumer: 'gh attestation verify <file> --repo BijdorpStudio/kiban' on a
      # jar or klib pulled from Maven Central answers "was this file built by this repository's
      # release workflow, from this commit" - a question the GPG signature, which says only that
      # the maintainer's key signed something, cannot answer.
      #
      # Binaries only. The '.pom' and '.module' files are metadata that Maven Central rewrites
      # nothing of but that no consumer executes, and leaving them out keeps the subject list to
      # the ~51 files (17 publications, each with its artifact, sources jar and javadoc jar) that
      # actually end up on a classpath.
      - name: Attest build provenance for the published artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/attestation-staging/nl/bijdorpstudio/kiban/**/*.jar
            build/attestation-staging/nl/bijdorpstudio/kiban/**/*.klib
            build/attestation-staging/nl/bijdorpstudio/kiban/**/*.aar

  docs:
    name: Publish API docs
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # The versions already published, kept on the 'docs-archive' branch by the job below (#162).
      # 'continue-on-error' covers the one case where that branch does not exist: the first release
      # after versioned docs landed. The generate step then falls through to the single-version site
      # this job produced before, and the archive starts existing from that release onwards.
      - name: Restore previously published doc versions
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: docs-archive
          path: docs-archive

      # Dokka resolves 'nativeMain'/'appleMain' through the Kotlin analysis
      # frontend, so this job downloads the Kotlin/Native distribution as well --
      # see the action's own comment.
      - uses: ./.github/actions/cache-konan

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Release-tag ref only, so the cache is read-only here as well; see the publish job.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Dokka HTML
        shell: bash
        run: |
          # The property is only passed when there is actually an archive to merge in: pointing the
          # versioning plugin at a directory holding no versions buys nothing, and not passing it at
          # all is the documented way to ask for the plain single-version site.
          older="$GITHUB_WORKSPACE/docs-archive/versions"
          if [ -d "$older" ] && [ -n "$(ls -A "$older")" ]; then
            echo "Archived versions being merged in: $(ls "$older" | tr '\n' ' ')"
            ./gradlew :library:dokkaGeneratePublicationHtml -Pkiban.previousDocVersions="$older"
          else
            echo "No archived versions restored; generating a single-version site."
            ./gradlew :library:dokkaGeneratePublicationHtml
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: library/build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Adds the version just published to the archive the 'docs' job restores from, so the next release
  # can put it behind the version dropdown (#162).
  #
  # It is a job of its own for one reason: 'contents: write' - what it takes to push a branch - must
  # not sit on a job that runs the Gradle build, where any dependency's build logic would inherit
  # it. This job runs no project code; it rearranges files and pushes them.
  #
  # It archives the Pages artifact this run just deployed rather than re-generating anything, so
  # what ends up behind the dropdown is byte for byte what was served as that version.
  archive-docs:
    name: Archive published API docs
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the deployed Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-artifact

      - name: Rebuild the docs archive branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # 'verify-version' has already established that the tag and the project version agree, so
          # the tag is a safe source for the version the docs were generated as.
          version="${TAG_NAME#v}"

          mkdir -p site archive/versions
          tar -xf pages-artifact/artifact.tar -C site

          # Everything served under 'older/' is a version that was already archived; carry those
          # over unchanged so the branch stays the complete set.
          if [ -d site/older ]; then
            for dir in site/older/*/; do
              [ -d "$dir" ] || continue
              cp -R "$dir" "archive/versions/$(basename "${dir%/}")"
            done
          fi

          # What sits at the root is the version just published. Its own copy of 'older/' is dropped
          # before archiving: keeping it would nest every past version inside every future one, and
          # the archive would double in size with every release.
          rm -rf site/older
          cp -R site "archive/versions/$version"

          echo "Archive now holds: $(ls archive/versions | tr '\n' ' ')"

          # A fresh repository with a single commit, force-pushed: the branch is a snapshot, not a
          # history, so it never accumulates the previous releases' copies as dangling git objects.
          # Nothing reads its history - the 'docs' job only ever checks out its tip.
          cd archive
          git init -q -b docs-archive
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Archive API docs for $version"
          git push -q --force \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" docs-archive
