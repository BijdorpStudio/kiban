# Dependency updates for the two ecosystems this repository uses: the Gradle
# version catalog and the actions the workflows depend on. It complements rather
# than replaces `./gradlew versionCatalogUpdate`; see
# docs/209-ci-workflow-notes.md.
version: 2

updates:
  # Dependabot reads `gradle/libs.versions.toml` directly; the `# @keep`
  # versions are not dependency declarations and are left alone. What to expect
  # of the pull requests, and the open question about AGP coverage, are in
  # docs/209-ci-workflow-notes.md.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # Every pull request runs the full check matrix, so patch and minor bumps
    # are batched. Major bumps still arrive one per pull request.
    groups:
      gradle-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # '/' covers '.github/workflows'; the composite actions under
  # '.github/actions' are separate manifests and escape coverage unless listed.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/cache-konan"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
