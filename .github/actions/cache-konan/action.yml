# Shared '~/.konan' cache step for every workflow that touches the Kotlin/Native
# toolchain, Dokka included. Without it, that is a fresh
# 'download.jetbrains.com' fetch per job. Why the key is what it is:
# docs/209-ci-workflow-notes.md.
name: Cache Kotlin/Native distribution
description: Restores and saves '~/.konan', keyed on the Kotlin version in the Gradle version catalog.

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
        # A version bump misses the exact key and still restores the most recent
        # entry, so the new bundle downloads against a warm cache.
        restore-keys: ${{ runner.os }}-konan-
