[versions]
agp = "9.4.1"
# @keep this version because it is not used in a dependency declaration
android-compileSdk = "36"
# @keep this version because it is not used in a dependency declaration
android-minSdk = "24"
assertk = "0.28.1"
dokka = "2.2.0"
# @keep this is library java compatibility version
java-version = "17"
junit = "4.13.2"
kotlin = "2.4.20"
# @keep this is library kotlin compatibility version
# The minimum Kotlin version a consumer needs, not what the library is built with. Raising it is a
# breaking change; see docs/209-build-script-notes.md and VERSIONING.md.
kotlin-version = "2.4.0"
ktfmt-plugin = "0.27.0"
maven-publish-plugin = "0.37.0"
tapmoc-plugin = "0.4.2"
# Test-only. Keep this on a stable release, and on the unified 1.1.0+ line; see
# docs/209-build-script-notes.md and docs/82-testballoon-evaluation.md.
testballoon = "1.1.0"
versions-catalogue-update-plugin = "1.1.1"

[libraries]
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
# Dokka plugin artifact, not a Gradle plugin: it goes on the 'dokkaPlugin' configuration so the
# Dokka generator itself loads it. Version-locked to the Dokka Gradle plugin above.
dokka-versioning-plugin = { module = "org.jetbrains.dokka:versioning-plugin", version.ref = "dokka" }
junit = { module = "junit:junit", version.ref = "junit" }
testballoon-framework-core = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testballoon" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compat-tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc-plugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish-plugin" }
testballoon = { id = "de.infix.testBalloon", version.ref = "testballoon" }
versions-catalogue-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "versions-catalogue-update-plugin" }
