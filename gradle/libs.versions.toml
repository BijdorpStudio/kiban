[versions]
agp = "9.3.1"
# @keep this version because it is not used in a dependency declaration
android-compileSdk = "36"
# @keep this version because it is not used in a dependency declaration
android-minSdk = "24"
assertk = "0.28.1"
dokka = "2.2.0"
# @keep this is library java compatibility version
java-version = "17"
junit = "4.13.2"
kotlin = "2.4.10"
kotlinx-binary-compatibility-validator = "0.18.1"
# @keep this is library kotlin compatibility version
# This is the minimum Kotlin version a consumer needs, not merely what the library is built with.
# Raising it is a breaking change for consumers who cannot follow, so after 1.0 it only moves in a
# major release (see VERSIONING.md) - which is why it moved to 2.4.0 before the freeze rather than
# after it. Two things depend on the floor:
#   - @IntroducedAt / ExperimentalVersionOverloading (kotlin package) do not resolve below a 2.4
#     languageVersion, and they are what lets an optional parameter be added to an already
#     published function without breaking binary compatibility. See #180.
#   - kotlin.time.Instant (CountryCodes.lastUpdateDate) is only a non-experimental stdlib
#     declaration from 2.3, so any floor below that turns a frozen public API into one that demands
#     @OptIn from callers. Subsumed by the 2.4 floor, but it is the reason the floor can never go
#     below 2.3. See docs/144-instant-api-stability.md.
kotlin-version = "2.4.0"
ktfmt-plugin = "0.27.0"
maven-publish-plugin = "0.37.0"
tapmoc-plugin = "0.4.2"
# Test-only. 1.1.0-RC is the first unified release: one artifact set auto-adapting to the Kotlin
# compiler in use (2.2.0+), instead of 1.0.x's per-Kotlin-version variants, which would have made
# every Kotlin bump a coupled TestBalloon bump. Move to 1.1.0 once it ships; it is binary
# compatible, so the bump is this line alone. See docs/82-testballoon-evaluation.md.
testballoon = "1.1.0-RC"
versions-catalogue-update-plugin = "1.1.1"

[libraries]
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
# Dokka plugin artifact, not a Gradle plugin: it is added to the 'dokkaPlugin' configuration so
# the Dokka generator itself loads it. Version-locked to the Dokka Gradle plugin above.
dokka-versioning-plugin = { module = "org.jetbrains.dokka:versioning-plugin", version.ref = "dokka" }
junit = { module = "junit:junit", version.ref = "junit" }
testballoon-framework-core = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testballoon" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compat-tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc-plugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinx-api-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "kotlinx-binary-compatibility-validator" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish-plugin" }
testballoon = { id = "de.infix.testBalloon", version.ref = "testballoon" }
versions-catalogue-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "versions-catalogue-update-plugin" }
